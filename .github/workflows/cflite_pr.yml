name: ClusterFuzzLite PR fuzzing

on:
  merge_group:
  pull_request:

permissions:
  contents: read

# A newer push makes the older run's verdict worthless, so it cancels that run rather than racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  PR:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
    steps:
      - name: Build Fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run Fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}

  all-checks:
    # Branch protection can only require named jobs, so a matrix leg that never ran would otherwise read as not failing.
    if: always()
    needs: [PR]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any check did not succeed
        run: |
          if [ "${{ needs.PR.result }}" != "success" ]; then
            echo "PR=${{ needs.PR.result }}"
            exit 1
          fi
          echo "all checks passed"
